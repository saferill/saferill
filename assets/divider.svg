<svg width="900" height="16" viewBox="0 0 900 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D1FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00D1FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes sweep {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(920px); }
    }
    .pulse { animation: sweep 3.2s ease-in-out infinite; }
  </style>
  <rect x="0" y="7" width="900" height="2" fill="url(#lineGrad)" />
  <rect class="pulse" x="0" y="6.5" width="220" height="3" rx="1.5" fill="url(#glowPulse)" />
</svg>
