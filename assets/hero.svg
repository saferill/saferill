<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#091926" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D1FF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00D1FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="228" rx="18" />
    </clipPath>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(18px, -12px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-16px, 14px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }
    @keyframes eq1 { 0%, 100% { height: 18px; y: 128px; } 50% { height: 54px; y: 92px; } }
    @keyframes eq2 { 0%, 100% { height: 48px; y: 98px; } 50% { height: 22px; y: 124px; } }
    @keyframes eq3 { 0%, 100% { height: 28px; y: 118px; } 50% { height: 68px; y: 78px; } }
    @keyframes eq4 { 0%, 100% { height: 60px; y: 86px; } 50% { height: 24px; y: 122px; } }
    @keyframes eq5 { 0%, 100% { height: 24px; y: 122px; } 50% { height: 50px; y: 96px; } }
    @keyframes eq6 { 0%, 100% { height: 42px; y: 104px; } 50% { height: 18px; y: 128px; } }
    @keyframes scanLine {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(960px); }
    }
    .orb-a { animation: floatSlow 7s ease-in-out infinite; }
    .orb-b { animation: floatReverse 8.5s ease-in-out infinite; }
    .dot-live { transform-origin: 64px 52px; animation: pulseDot 1.8s ease-in-out infinite; }
    .scan { animation: scanLine 4.2s linear infinite; }
    .b1 { animation: eq1 1.1s ease-in-out infinite; }
    .b2 { animation: eq2 0.9s ease-in-out infinite; }
    .b3 { animation: eq3 1.25s ease-in-out infinite; }
    .b4 { animation: eq4 1.0s ease-in-out infinite; }
    .b5 { animation: eq5 1.15s ease-in-out infinite; }
    .b6 { animation: eq6 0.95s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="230" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="900" height="230" fill="url(#grid)" />

    <circle class="orb-a" cx="160" cy="60" r="190" fill="url(#orb1)" />
    <circle class="orb-b" cx="760" cy="180" r="210" fill="url(#orb2)" />

    <!-- Animated top scan highlight -->
    <rect class="scan" x="0" y="0" width="240" height="2.5" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Status Pill -->
    <rect x="44" y="36" width="214" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="64" cy="51" r="7" fill="#00D1FF" opacity="0.22" />
    <circle class="dot-live" cx="64" cy="51" r="4" fill="#00D1FF" />
    <text x="80" y="55" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.1">OPEN SOURCE · ACTIVE</text>

    <!-- Main Title -->
    <text x="44" y="122" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      Syaf <tspan fill="url(#accentGrad)">// saferill</tspan>
    </text>

    <!-- Subtitle -->
    <text x="46" y="156" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="500">
      Mobile &amp; Multiplatform Developer · Building <tspan fill="#38BDF8" font-weight="700">HiFi</tspan> &amp; <tspan fill="#A5B4FC" font-weight="700">Al-Huda</tspan>
    </text>

    <!-- Tech mini tags -->
    <rect x="46" y="176" width="76" height="24" rx="6" fill="#111C33" stroke="#1E3A5F" />
    <text x="84" y="192" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Kotlin</text>

    <rect x="130" y="176" width="84" height="24" rx="6" fill="#111C33" stroke="#1E3A5F" />
    <text x="172" y="192" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Compose</text>

    <rect x="222" y="176" width="78" height="24" rx="6" fill="#111C33" stroke="#1E3A5F" />
    <text x="261" y="192" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Flutter</text>

    <rect x="308" y="176" width="80" height="24" rx="6" fill="#111C33" stroke="#1E3A5F" />
    <text x="348" y="192" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Next.js</text>

    <!-- Animated Audio Equalizer Box (Right) -->
    <rect x="692" y="48" width="164" height="128" rx="16" fill="#0B1220" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.2" />
    <rect class="b1" x="716" y="110" width="12" height="36" rx="6" fill="url(#accentGrad)" />
    <rect class="b2" x="738" y="96" width="12" height="50" rx="6" fill="url(#accentGrad)" />
    <rect class="b3" x="760" y="84" width="12" height="62" rx="6" fill="url(#accentGrad)" />
    <rect class="b4" x="782" y="92" width="12" height="54" rx="6" fill="url(#accentGrad)" />
    <rect class="b5" x="804" y="106" width="12" height="40" rx="6" fill="url(#accentGrad)" />
    <rect class="b6" x="826" y="116" width="12" height="30" rx="6" fill="url(#accentGrad)" />
    <text x="774" y="164" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.4">HIFI · WAVEFORM</text>
  </g>

  <rect x="1" y="1" width="898" height="228" rx="18" stroke="#1E293B" stroke-width="1.5" />
</svg>
